function bindModerationDetail(c){
  const content=el('content');
  const rer=()=>renderModerationDetail();
  content.querySelector('#modBack').addEventListener('click',()=>navigate('moderation'));
  content.querySelector('#modClose').addEventListener('click',()=>navigate('moderation'));
  content.querySelector('#modOpenCase').addEventListener('click',()=>navigate('case',{caseId:c.id}));
  // Inline-editable account info fields (auto-save on blur)
  content.querySelectorAll('.val.editable[data-field]').forEach(el2=>{
    el2.addEventListener('blur',()=>{
      const c2=caseById(c.id); if(!c2) return;
      const field=el2.getAttribute('data-field');
      let raw=el2.textContent.trim();
      if(el2.getAttribute('data-numeric')){ raw=String(parseInt(raw.replace(/[^0-9]/g,''),10)||0); c2[field]=parseInt(raw,10); el2.textContent=fmtFollowers(c2[field]); }
      else { c2[field]=raw||'—'; }
      addLog(c2,'Moderation: "'+field+'" updated to '+(c2[field]));
      persist(); showToast('Saved',field+' updated automatically.','success');
    });
    el2.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); el2.blur(); } });
  });
  // Suggested fix (auto-save on blur)
  const fixEl=content.querySelector('#modFix');
  if(fixEl){
    fixEl.addEventListener('blur',()=>{
      const c2=caseById(c.id); if(!c2) return;
      const v=fixEl.textContent.trim();
      if(v && v!==c2.suggestedFix){ c2.suggestedFix=v; addLog(c2,'Moderation: suggested fix updated.'); persist(); showToast('Saved','Suggested fix updated automatically.','success'); }
    });
  }
  // Violation signal pills (click to clear)
  content.querySelectorAll('.mod-pill[data-sig]').forEach(p=> p.addEventListener('click',()=>{
    const c2=caseById(c.id); if(!c2) return;
    const k=p.getAttribute('data-sig');
    c2.signals[k]=false; addLog(c2,'Moderation: signal "'+SIGNAL_LABELS[k].label+'" cleared.');
    persist(); showToast('Signal cleared',SIGNAL_LABELS[k].label+' removed.','info'); rer();
  }));
  // Add signal menu
  const addSig=content.querySelector('#modAddSig');
  if(addSig) addSig.addEventListener('click',(e)=>{
    const c2=caseById(c.id); if(!c2) return;
    const avail=Object.keys(SIGNAL_LABELS).filter(k=>!c2.signals[k]);
    openMenuAt(e.currentTarget, avail.map(k=>({id:k,label:SIGNAL_LABELS[k].label,icon:'flag',onClick:()=>{ const c3=caseById(c.id); if(!c3) return; c3.signals[k]=true; addLog(c3,'Moderation: signal "'+SIGNAL_LABELS[k].label+'" flagged.'); persist(); showToast('Signal added',SIGNAL_LABELS[k].label+' flagged.','success'); rer(); }})), {align:'left'});
  });
  // Login activity: risk change + remove + add
  content.querySelectorAll('.lr-risk-sel').forEach(sel=> sel.addEventListener('change',()=>{
    const c2=caseById(c.id); if(!c2) return;
    const i=+sel.getAttribute('data-idx');
    if(c2.loginActivity[i]){ c2.loginActivity[i].ipRisk=sel.value; addLog(c2,'Moderation: login risk for '+c2.loginActivity[i].country+' set to '+sel.value+'.'); persist(); showToast('Saved','Login risk updated.','success'); rer(); }
  }));
  content.querySelectorAll('.lr-rm').forEach(b=> b.addEventListener('click',()=>{
    const c2=caseById(c.id); if(!c2) return;
    const i=+b.getAttribute('data-idx');
    const rem=c2.loginActivity.splice(i,1)[0];
    addLog(c2,'Moderation: removed login activity for '+(rem&&rem.country||'a session')+'.');
    persist(); showToast('Removed','Login session removed.','info'); rer();
  }));
  const laAdd=content.querySelector('#modLaAdd');
  if(laAdd) laAdd.addEventListener('click',()=>{
    const c2=caseById(c.id); if(!c2) return;
    const country=content.querySelector('#modLaCountry').value.trim();
    const device=content.querySelector('#modLaDevice').value.trim();
    const risk=content.querySelector('#modLaRisk').value;
    if(!country && !device){ showToast('Missing info','Enter at least a country or device.','error'); return; }
    c2.loginActivity.push({country:country||'Unknown',device:device||'—',ipRisk:risk});
    addLog(c2,'Moderation: login activity added ('+(country||'Unknown')+'/'+risk+').');
    persist(); showToast('Saved','Login session added automatically.','success'); rer();
  });
  // Actions
  const reactBtn=content.querySelector('#modReactivate');
  if(reactBtn) reactBtn.addEventListener('click',()=>{ if(reactBtn.disabled) return; reactivateCase(c.id); });
  const apprBtn=content.querySelector('#modApprove');
  if(apprBtn) apprBtn.addEventListener('click',()=>{
    if(apprBtn.disabled) return;
    const c2=caseById(c.id); if(!c2) return;
    if(c2.approvedAt){ showToast('Already approved',c2.username+' is already approved.','info'); return; }
    confirmAction({title:'Approve this account?',message:c2.username+' will be marked as Approved (status → Resolution). This is a simulated record.',confirmText:'Approve',variant:'success',onConfirm:()=>{
      const c3=caseById(c.id); if(!c3) return;
      c3.approvedAt=Date.now(); c3.status='Resolution'; c3.progress=STAGE_INDEX['Resolution']; if(!c3.restoredAt) c3.restoredAt=Date.now();
      addLog(c3,'Moderation: account approved.');
      persist(); showToast('Account approved',c3.username+' approved.','success'); rer();
    }});
  });
  const upBtn=content.querySelector('#modUploadId');
  if(upBtn) upBtn.addEventListener('click',()=>openUploadIdDialog(c.id));
  const apBtn=content.querySelector('#modSendAppeal');
  if(apBtn) apBtn.addEventListener('click',()=>openSendAppealDialog(c.id));
  // Progress slider: live label/bar on input, auto-save on change
  const slider=content.querySelector('#modSlider');
  const pctVal=content.querySelector('#modPctVal');
  const bar=content.querySelector('#modBar');
  if(slider){
    slider.addEventListener('input',()=>{ const v=parseInt(slider.value,10); if(pctVal) pctVal.textContent=v+'%'; if(bar) bar.style.width=v+'%'; });
    slider.addEventListener('change',()=>{ const c2=caseById(c.id); if(!c2) return; c2.modProgress=parseInt(slider.value,10); persist(); });
  }
  const upProg=content.querySelector('#modUpdateProg');
  if(upProg) upProg.addEventListener('click',()=>{
    const c2=caseById(c.id); if(!c2) return;
    const v=parseInt(slider?slider.value:pct,10)||0;
    c2.modProgress=v; addLog(c2,'Moderation: case progress updated to '+v+'%.');
    persist(); showToast('Progress saved','Case progress set to '+v+'%.','success'); rer();
  });
}
function openUploadIdDialog(id){
  const c=caseById(id); if(!c) return;
  openModal({title:'Upload ID Verification',subtitle:esc(c.username)+' · attach an identity document',size:'modal-sm',icon:'upload',body:
    '<div class="field"><label>ID document (image, ≤2 MB)</label><input type="file" id="uidFile" accept="image/*" class="input" style="padding:7px"></div>'+
    '<div class="sim-notice" style="margin-top:12px">'+icon('info')+'<span>The image is stored locally in your browser (localStorage) as part of this case record. This is a simulated workflow.</span></div>'+
    (c.idProofs.length?'<div style="margin-top:10px;font-size:12px;color:var(--muted)">'+c.idProofs.length+' ID file'+(c.idProofs.length!==1?'s':'')+' already attached.</div>':''),
    footer:'<button class="btn btn-secondary btn-sm" data-c="close">Cancel</button><div class="spacer"></div><button class="btn btn-primary btn-sm" id="uidOk" disabled style="opacity:.5">'+icon('upload')+'<span>Attach</span></button>',
    onReady:(ctx)=>{
      const m=ctx.modal; const f=m.querySelector('#uidFile'); const ok=m.querySelector('#uidOk'); let chosen=null;
      f.addEventListener('change',()=>{
        const file=f.files&&f.files[0]; if(!file){ chosen=null; ok.disabled=true; ok.style.opacity=.5; return; }
        if(file.size>2*1024*1024){ showToast('File too large','Please use an image under 2 MB.','error'); f.value=''; chosen=null; ok.disabled=true; ok.style.opacity=.5; return; }
        chosen=file; ok.disabled=false; ok.style.opacity=1;
      });
      ok.addEventListener('click',()=>{
        if(!chosen) return;
        const reader=new FileReader();

      '<div class="form-row-1 field"><label>Email <span class="req">*</span></label><input class="input" type="email" id="uEmail" value="'+esc(data.email)+'"></div>'+
      '<div class="form-row-1 field"><label>Password '+(isEdit?'<span class="cell-muted" style="font-weight:400">(leave blank to keep current)</span>':'<span class="req">*</span>')+'</label><input class="input" type="text" id="uPass" placeholder="'+(isEdit?'•••••••':'Set a password')+'"></div>'+
      '<div class="form-row"><div class="field"><label>Role</label><select class="select" id="uRole"><option value="agent"'+(data.role==='agent'?' selected':'')+'>Agent</option><option value="admin"'+(data.role==='admin'?' selected':'')+'>Admin</option></select></div>'+
      '<div class="field"><label>Agent Code</label><input class="input" id="uCode" value="'+esc(data.agentCode)+'" placeholder="NP-XXX-000"></div></div>'+
      (isEdit?'<div class="form-row-1 field"><label>Status</label><select class="select" id="uStatus"><option value="active"'+(data.status==='active'?' selected':'')+'>Active</option><option value="inactive"'+(data.status==='inactive'?' selected':'')+'>Inactive</option></select></div>':'')+
    '</div>',
    footer:'<button class="btn btn-secondary btn-sm" data-c="close">Cancel</button><div class="spacer"></div>'+(isEdit?'<button class="btn btn-danger btn-sm" id="uDelete" style="margin-right:auto">'+icon('trash')+'<span>Delete</span></button>':'')+'<button class="btn btn-primary btn-sm" id="uSave">'+icon('save')+'<span>'+(isEdit?'Save Changes':'Create User')+'</span></button>',
    onReady:(ctx)=>{
      const m=ctx.modal;
      m.querySelectorAll('input,select').forEach(i=> i.addEventListener('input',()=>setModalDirty(true)));
      m.querySelector('#uSave').addEventListener('click',()=>{
        const name=m.querySelector('#uName').value.trim();
        const email=m.querySelector('#uEmail').value.trim().toLowerCase();
        if(!name){ showToast('Validation error','Name is required.','error'); return; }
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Validation error','Valid email is required.','error'); return; }
        if(db.users.find(u=>u.email===email && u.id!==data.id)){ showToast('Validation error','Email already in use.','error'); return; }
        const pass=m.querySelector('#uPass').value;
        if(!isEdit && !pass){ showToast('Validation error','Password is required.','error'); return; }
        const obj={id:data.id,name,email,password:pass||(data.password||''),role:m.querySelector('#uRole').value,agentCode:m.querySelector('#uCode').value.trim()||('NP-'+(data.role==='admin'?'ADM':'AGT')+'-'+Math.floor(100+Math.random()*900)),status:isEdit?m.querySelector('#uStatus').value:'active',created:data.created};
        if(isEdit){ const idx=db.users.findIndex(u=>u.id===obj.id); db.users[idx]=obj; showToast('User saved',obj.name+' updated.','success'); }
        else { db.users.push(obj); showToast('User created',obj.name+' added.','success'); }
        persist(); setModalDirty(false); closeModal(); renderAccounts(); renderShell();
      });
      if(isEdit){ const d=m.querySelector('#uDelete'); if(d) d.addEventListener('click',()=>{ if(data.id===currentUser().id){ showToast('Cannot delete self','You cannot delete your own account.','error'); return; } confirmAction({title:'Delete user?',message:data.name+' will lose portal access. This cannot be undone.',confirmText:'Delete',variant:'danger',onConfirm:()=>{ db.users=db.users.filter(u=>u.id!==data.id); persist(); setModalDirty(false); closeModal(); showToast('User deleted',data.name+' removed.','success'); renderAccounts(); renderShell(); }}); }); }
    }
  });
}
function deleteUser(id){
  const x=db.users.find(u=>u.id===id); if(!x) return;
  if(id===currentUser().id){ showToast('Cannot delete self','You cannot delete your own account.','error'); return; }
  if(db.users.length<=1){ showToast('Cannot delete','At least one user must remain.','error'); return; }
  confirmAction({title:'Delete user?',message:x.name+' will lose portal access permanently.',confirmText:'Delete',variant:'danger',onConfirm:()=>{ db.users=db.users.filter(u=>u.id!==id); persist(); showToast('User deleted',x.name+' removed.','success'); renderAccounts(); renderShell(); }});
}

            '<button class="btn btn-secondary btn-sm" id="setImport">'+icon('upload')+'<span>Import JSON</span></button>'+

        '<div class="card"><div class="card-head"><h3>About</h3></div><div class="card-body">'+

/* ---------- Data export / import / reset ---------- */
function exportData(){
  const payload={exportedAt:new Date().toISOString(),version:1,users:db.users,cases:db.cases,takedowns:db.takedowns,settings:db.settings};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='nikhil-portal-export-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('Export ready','JSON backup downloaded.','success');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data || typeof data!=='object') throw new Error('Invalid JSON');
      const validUsers=Array.isArray(data.users); const validCases=Array.isArray(data.cases); const validTd=Array.isArray(data.takedowns);
      if(!(validUsers||validCases||validTd)) throw new Error('No recognised data arrays found');
      // backup first
      Store.set(KEYS.backup,{at:Date.now(),users:db.users,cases:db.cases,takedowns:db.takedowns,settings:db.settings});
      confirmAction({
        title:'Import this data?',
        message:'Current local data will be replaced with the imported file. A backup of the current data has been stored.',
        confirmText:'Replace data',variant:'warn',
        extra:'<div style="font-size:12px;color:var(--muted)">Imported: '+(validUsers?data.users.length+' users, ':'')+(validCases?data.cases.length+' cases, ':'')+(validTd?data.takedowns.length+' takedowns':'')+'</div>',
        onConfirm:()=>{
          if(validUsers) db.users=data.users;
          if(validCases) db.cases=data.cases;
          if(validTd) db.takedowns=data.takedowns;
          if(data.settings && typeof data.settings==='object') db.settings=Object.assign({sidebarCollapsed:false},data.settings);
          persist(); showToast('Import complete','Data replaced from file. A backup was kept.','success');
          renderShell(); navigate('dashboard');
        }
      });
    }catch(err){ showToast('Import failed','Could not parse JSON: '+err.message,'error'); }
  };
  reader.onerror=()=>showToast('Import failed','Could not read the file.','error');
  reader.readAsText(file);
}
function resetAllData(){
  Store.set(KEYS.backup,{at:Date.now(),users:db.users,cases:db.cases,takedowns:db.takedowns,settings:db.settings});
  Store.remove(KEYS.users); Store.remove(KEYS.cases); Store.remove(KEYS.takedowns); Store.remove(KEYS.settings);
  seedAll(); showToast('Data reset','Sample data reloaded. A backup of the previous data was kept.','success');
  renderShell(); navigate('dashboard');
}

/* ============================================================
   BOOT
   ============================================================ */
function bootApp(){
  loadDB();
  seedAll();
  loadDB();
  // Safety net: if a previous session left an empty (but present) users key,
  // re-create the demo accounts so login can never lock the user out.
  if(db.users.length===0){ ensureDemoUsers(); }
  loadSession();
  // global keyboard: Ctrl/Cmd+S toggles sidebar
  document.addEventListener('keydown',(e)=>{
    if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S')){
      e.preventDefault();
      if(isAuthenticated()) toggleSidebar();
      return false;
    }
  });
  // close menus on scroll/resize
  window.addEventListener('resize',()=>{ closeMenu(); if(window.innerWidth>640){ el('sidebar').classList.remove('open'); el('drawerOverlay').classList.remove('show'); } applySidebarState(); });
  if(isAuthenticated()) enterApp(); else showLogin();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bootApp);
else bootApp();
// safety retry if #app unavailable
setTimeout(()=>{ if(!el('app')){ try{ bootApp(); }catch(e){ console.warn('boot retry failed',e); } } },200);
</script>
