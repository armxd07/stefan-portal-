<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nikhil Portal — Meta Recovery & Protection Console. A simulated administrative dashboard for case management.">
<title>Nikhil Portal — Meta Recovery & Protection Console</title>
<style>
/* ============================================================
   NIKHIL PORTAL — Design System
   ============================================================ */
:root{
  --navy:#0A1F44;
  --navy-2:#102B59;
  --navy-3:#1B3A7A;
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --text:#15243B;
  --muted:#78869B;
  --border:#E5EAF1;
  --border-strong:#D4DCE8;
  --success:#16A36A;
  --success-bg:#E7F6EF;
  --danger:#DC3545;
  --danger-bg:#FDECEE;
  --warn:#E0A100;
  --warn-bg:#FFF6E0;
  --info:#2B7BD9;
  --info-bg:#E9F2FD;
  --ig-grad:linear-gradient(135deg,#0A1F44 0%,#1B3A7A 100%);
  --shadow-sm:0 1px 2px rgba(10,31,68,.06),0 1px 3px rgba(10,31,68,.04);
  --shadow-md:0 4px 12px rgba(10,31,68,.08),0 2px 4px rgba(10,31,68,.04);
  --shadow-lg:0 18px 48px rgba(10,31,68,.16),0 6px 12px rgba(10,31,68,.08);
  --radius:14px;
  --radius-sm:10px;
  --radius-xs:8px;
  --sidebar-w:264px;
  --topbar-h:76px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
svg{display:block;flex-shrink:0}
::selection{background:rgba(27,58,122,.18)}
/* Scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#b9c4d6;background-clip:padding-box}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:42px;padding:0 18px;border-radius:var(--radius-xs);
  font-size:14px;font-weight:600;white-space:nowrap;
  transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),transform .08s var(--ease);
  user-select:none;line-height:1;
}
.btn svg{width:18px;height:18px}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid rgba(43,123,217,.35);outline-offset:2px}
.btn:disabled,.btn.is-disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-sm{height:34px;padding:0 14px;font-size:13px;border-radius:var(--radius-xs)}
.btn-sm svg{width:16px;height:16px}
.btn-lg{height:48px;padding:0 22px;font-size:15px}
.btn-block{display:flex;width:100%}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-3)}
.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--border-strong)}
.btn-secondary:hover{border-color:var(--navy);background:#F8FAFD}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid transparent}
.btn-danger:hover{background:#fbd9de}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn-danger-solid:hover{background:#c12935}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#139058}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:rgba(10,31,68,.05);color:var(--text)}
.btn-ghost-navy{background:transparent;color:#fff}
.btn-ghost-navy:hover{background:rgba(255,255,255,.12)}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:var(--radius-xs);
  color:var(--muted);transition:background .18s var(--ease),color .18s var(--ease);
  flex-shrink:0;
}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{background:rgba(10,31,68,.06);color:var(--text)}
.icon-btn:focus-visible{outline:3px solid rgba(43,123,217,.35);outline-offset:2px}
.icon-btn-navy{color:rgba(255,255,255,.7)}
.icon-btn-navy:hover{background:rgba(255,255,255,.1);color:#fff}

/* ============================================================
   Badges & pills
   ============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1;
  white-space:nowrap;
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge-blue{background:var(--info-bg);color:#1d63ad}
.badge-green{background:var(--success-bg);color:#0f7d4f}
.badge-red{background:var(--danger-bg);color:#b3232f}
.badge-amber{background:var(--warn-bg);color:#9a6e00}
.badge-gray{background:#EEF1F6;color:#5b6b82}
.badge-purple{background:#E7ECF6;color:#0A1F44}
.badge-ig{background:var(--ig-grad);color:#fff}
.badge-lg{padding:6px 12px;font-size:13px}

/* ============================================================
   Login
   ============================================================ */
#loginScreen{
  position:fixed;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 0%,#102B59 0%,#0A1F44 60%,#06152E 100%);
  padding:24px;overflow:auto;
}
.login-card{
  width:100%;max-width:420px;background:#fff;border-radius:18px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:scaleIn .5s var(--ease-out);
}
.login-head{padding:36px 32px 24px;text-align:center}
.login-logo{
  width:64px;height:64px;border-radius:18px;margin:0 auto 18px;
  background:var(--ig-grad);display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 28px rgba(10,31,68,.35);
}
.login-logo svg{width:34px;height:34px;color:#fff}
.login-head h1{font-size:24px;font-weight:800;margin:0 0 6px;color:var(--navy);letter-spacing:-.3px}
.login-head p{font-size:13px;color:var(--muted);margin:0}
.login-body{padding:8px 32px 12px}
.login-foot{padding:16px 32px 28px;border-top:1px solid var(--border);background:#FAFBFD}
.login-foot h4{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px}
.demo-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-xs);margin-bottom:8px;background:#fff;
}
.demo-row:last-child{margin-bottom:0}
.demo-row .who{font-size:12px}
.demo-row .who b{display:block;color:var(--text);font-size:13px}
.demo-row .who span{color:var(--muted)}
.demo-fill{font-size:11px;color:var(--info);font-weight:600;cursor:pointer;white-space:nowrap}
.demo-fill:hover{text-decoration:underline}
.login-err{color:var(--danger);font-size:12px;margin-top:6px;display:none}
.login-err.show{display:block}
.login-note{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
.login-reset{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--info);cursor:pointer;padding:6px;border-radius:8px;transition:background .15s}
.login-reset:hover{background:#E9F2FD;text-decoration:none}
.login-reset.flash{animation:flashPulse 1.4s ease 2}
.login-reset svg{width:14px;height:14px}
@keyframes flashPulse{0%,100%{background:transparent}50%{background:#E9F2FD}}
.diag-line{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}

/* ============================================================
   App Shell
   ============================================================ */
#app{display:none;min-height:100vh}
#app.is-authed{display:block}

.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:var(--navy);color:#fff;z-index:40;
  display:flex;flex-direction:column;
  transition:transform .28s var(--ease),width .28s var(--ease);
}
.sidebar::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--ig-grad);
}
.sidebar-head{padding:20px 18px 14px;display:flex;align-items:center;gap:12px}
.sidebar-logo{
  width:40px;height:40px;border-radius:11px;background:var(--ig-grad);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-logo svg{width:22px;height:22px;color:#fff}
.sidebar-brand{flex:1;min-width:0}
.sidebar-brand .name{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.1}
.sidebar-brand .sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.sidebar-toggle{
  margin-left:auto;color:rgba(255,255,255,.6);width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sidebar-toggle:hover{background:rgba(255,255,255,.1);color:#fff}
.sidebar-toggle svg{width:18px;height:18px}
.nav-scroll{flex:1;overflow-y:auto;padding:8px 12px 12px}
.nav-label{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:rgba(255,255,255,.35);padding:14px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
  color:rgba(255,255,255,.72);font-size:14px;font-weight:500;cursor:pointer;
  transition:background .15s var(--ease),color .15s var(--ease);position:relative;width:100%;text-align:left;
}
.nav-item svg{width:19px;height:19px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active::before{
  content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--ig-grad);
}
.nav-item .nav-badge{margin-left:auto}
.nav-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.nav-build{font-size:10px;color:rgba(255,255,255,.4);text-align:center;margin-top:10px;letter-spacing:.2px}
.agent-card{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);
}
.agent-card .av{flex-shrink:0}
.agent-card .meta{flex:1;min-width:0}
.agent-card .meta .n{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-card .meta .r{font-size:11px;color:rgba(255,255,255,.5);text-transform:capitalize}

/* Avatar */
.av{width:38px;height:38px;border-radius:50%;background:var(--ig-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.av-sm{width:32px;height:32px;font-size:12px}
.av-lg{width:52px;height:52px;font-size:18px}
.av-xl{width:72px;height:72px;font-size:24px}
.av-navy{background:var(--navy)}
.av-img{overflow:hidden;background:#EEF1F6}
.av-img img{width:100%;height:100%;object-fit:cover;display:block}
.av-img-fail{background:var(--ig-grad)}
.pfp-picker{display:flex;gap:14px;align-items:center}
.pfp-preview{width:64px;height:64px;border-radius:50%;background:#EEF1F6;border:2px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.pfp-preview svg{width:28px;height:28px}
.pfp-inputs{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.pfp-inputs .btn{align-self:flex-start}

/* Main */
.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .28s var(--ease)}
.topbar{
  position:sticky;top:0;z-index:30;height:var(--topbar-h);
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 22px;
}
.topbar .tb-toggle{display:none}
.tb-date{display:flex;flex-direction:column;line-height:1.2}
.tb-date .d{font-size:14px;font-weight:600;color:var(--text)}
.tb-date .t{font-size:11px;color:var(--muted)}
.search-wrap{position:relative;margin-left:auto;flex:0 1 320px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search-wrap input{
  width:100%;height:40px;padding:0 14px 0 38px;border-radius:10px;
  border:1px solid var(--border);background:#F8FAFD;color:var(--text);transition:border-color .15s,background .15s;
}
.search-wrap input:focus{outline:none;border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(10,31,68,.08)}
.notif{position:relative}
.notif .pip{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.profile-pill{
  display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:999px;border:1px solid var(--border);cursor:pointer;transition:border-color .15s,background .15s;
}
.profile-pill:hover{border-color:var(--border-strong);background:#F8FAFD}
.profile-pill .pp-meta{line-height:1.2}
.profile-pill .pp-meta .n{font-size:13px;font-weight:600}
.profile-pill .pp-meta .r{font-size:11px;color:var(--muted);text-transform:capitalize}
.profile-pill .chev{width:16px;height:16px;color:var(--muted)}

.content{flex:1;padding:26px 28px 60px;max-width:1500px;width:100%}
.view{animation:fadeIn .35s var(--ease-out)}
.view-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.view-head .vh-text{flex:1;min-width:0}
.view-head h1{font-size:24px;font-weight:800;letter-spacing:-.3px;margin:0 0 4px;color:var(--navy)}
.view-head p{font-size:14px;color:var(--muted);margin:0}
.view-head .vh-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px;font-weight:700;margin:0;color:var(--text)}
.card-head .sub{font-size:12px;color:var(--muted)}
.card-head .spacer{margin-left:auto}
.card-body{padding:20px}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 12px}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat .si{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat .si svg{width:22px;height:22px}
.stat .sv{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1}
.stat .sl{font-size:12px;color:var(--muted);margin-top:6px;font-weight:500}
.stat .strend{font-size:11px;color:var(--muted);margin-top:8px}
.si-blue{background:var(--info-bg);color:#1d63ad}
.si-green{background:var(--success-bg);color:#0f7d4f}
.si-red{background:var(--danger-bg);color:#b3232f}
.si-amber{background:var(--warn-bg);color:#9a6e00}
.si-purple{background:#E7ECF6;color:#0A1F44}
.si-ig{background:var(--ig-grad);color:#fff}

/* Tables */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.tbl thead th{
  text-align:left;padding:11px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  color:var(--muted);background:#FAFBFD;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
}
table.tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:#F8FAFD}
table.tbl tbody tr:last-child td{border-bottom:none}
.t-username{display:flex;align-items:center;gap:10px}
.t-username .uname{font-weight:600;color:var(--text)}
.t-username .usub{font-size:11px;color:var(--muted)}
.t-link{color:var(--info);font-weight:500;display:inline-flex;align-items:center;gap:4px;font-size:12px}
.t-link:hover{text-decoration:underline}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.cell-muted{color:var(--muted);font-size:12px}
.progress{height:6px;background:#EEF1F6;border-radius:999px;overflow:hidden;min-width:90px}
.progress>span{display:block;height:100%;background:var(--ig-grad);border-radius:999px;transition:width .4s var(--ease)}
.progress-txt{font-size:11px;color:var(--muted);margin-bottom:4px}

/* Forms */
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:14px}
.form-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:14px}
.form-row-1{margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text)}
.field .hint{font-size:11px;color:var(--muted)}
.field .req{color:var(--danger);margin-left:2px}
.input,.select,.textarea{
  width:100%;height:42px;padding:0 12px;border:1.5px solid var(--border-strong);border-radius:var(--radius-xs);
  background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s;
}
.textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,31,68,.1)}
.input.error,.select.error,.textarea.error{border-color:var(--danger)}
.field-error{font-size:11px;color:var(--danger);display:none}
.field-error.show{display:block}
.input-group{position:relative;display:flex;align-items:center}
.input-group .ig-btn{
  position:absolute;right:6px;width:30px;height:30px;border-radius:7px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.input-group .ig-btn:hover{background:rgba(10,31,68,.06);color:var(--text)}
.input-group .ig-btn svg{width:18px;height:18px}
.input-group .input{padding-right:42px}
.checkbox-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;transition:border-color .15s,background .15s}
.checkbox-row:hover{border-color:var(--border-strong);background:#F8FAFD}
.checkbox-row input{width:16px;height:16px;accent-color:var(--navy);cursor:pointer}
.checkbox-row .cl{font-size:13px;font-weight:500}
.checkbox-row .csub{font-size:11px;color:var(--muted);margin-left:auto}
.checkbox-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* Filter bar */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.toolbar .search-mini{position:relative;flex:0 1 280px}
.toolbar .search-mini svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.toolbar .search-mini input{width:100%;height:40px;padding:0 14px 0 38px;border:1.5px solid var(--border-strong);border-radius:10px;background:#fff}
.toolbar .search-mini input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,31,68,.08)}
.select-mini{height:40px}
.toolbar .spacer{margin-left:auto}
.filter-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--border-strong);background:#fff;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.filter-chip:hover{border-color:var(--navy)}
.seg{display:inline-flex;border:1.5px solid var(--border-strong);border-radius:10px;overflow:hidden}
.seg button{padding:0 12px;height:38px;font-size:12px;font-weight:600;color:var(--muted);border-right:1.5px solid var(--border-strong)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--navy);color:#fff}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.pagination .info{font-size:12px;color:var(--muted)}
.pagination .pages{display:flex;gap:4px}
.pagination .pages button{min-width:34px;height:34px;padding:0 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.pagination .pages button:hover{background:#EEF1F6;color:var(--text)}
.pagination .pages button.active{background:var(--navy);color:#fff}
.pagination .pages button:disabled{opacity:.4;cursor:not-allowed}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:60;background:rgba(8,18,38,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fadeIn .2s var(--ease-out)}
.modal{width:100%;max-width:680px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:slideUp .32s var(--ease-out);margin:auto}
.modal.modal-lg{max-width:920px}
.modal.modal-sm{max-width:460px}
.modal-head{position:relative;background:var(--navy);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px}
.modal-head::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ig-grad)}
.modal-head h3{font-size:17px;font-weight:700;margin:0;flex:1}
.modal-head .mh-sub{font-size:12px;color:rgba(255,255,255,.6);font-weight:400}
.modal-head .close{color:rgba(255,255,255,.7);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-head .close:hover{background:rgba(255,255,255,.12);color:#fff}
.modal-body{padding:22px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;background:#FAFBFD}
.modal-foot .spacer{margin-left:auto}
.modal-sec{margin-bottom:22px}
.modal-sec:last-child{margin-bottom:0}
.modal-sec h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.dyn-row{display:grid;grid-template-columns:1.2fr 1.4fr 1.6fr auto;gap:10px;align-items:flex-start;margin-bottom:10px}
.dyn-row-3{display:grid;grid-template-columns:1.4fr 1fr 1.6fr auto;gap:10px;align-items:flex-start;margin-bottom:10px}
.dyn-row .input,.dyn-row .select{height:38px}
.dyn-add{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--info);cursor:pointer;padding:6px 0}
.dyn-add:hover{text-decoration:underline}
.dyn-rm{width:38px;height:38px;border-radius:8px;color:var(--danger);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dyn-rm:hover{background:var(--danger-bg)}
.dyn-rm:disabled{opacity:.3;cursor:not-allowed}

/* Toast */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:90;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:360px}
.toast{
  pointer-events:auto;background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);border-left:4px solid var(--info);
  padding:13px 16px;display:flex;align-items:flex-start;gap:12px;animation:slideInRight .3s var(--ease-out);min-width:280px;
}
.toast.t-success{border-left-color:var(--success)}
.toast.t-error{border-left-color:var(--danger)}
.toast.t-warn{border-left-color:var(--warn)}
.toast.t-info{border-left-color:var(--info)}
.toast .ti{width:22px;height:22px;flex-shrink:0;margin-top:1px}
.toast.t-success .ti{color:var(--success)}
.toast.t-error .ti{color:var(--danger)}
.toast.t-warn .ti{color:var(--warn)}
.toast.t-info .ti{color:var(--info)}
.toast .tb-tx{flex:1;min-width:0}
.toast .tb-tx .tt{font-size:13px;font-weight:700;color:var(--text)}
.toast .tb-tx .tm{font-size:12px;color:var(--muted);margin-top:2px}
.toast .tx-close{color:var(--muted);width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast .tx-close:hover{background:#EEF1F6;color:var(--text)}
.toast.leaving{animation:slideOutRight .25s var(--ease) forwards}

/* Confirm */
.confirm-overlay{position:fixed;inset:0;z-index:80;background:rgba(8,18,38,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s var(--ease-out)}
.confirm-box{width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:scaleIn .25s var(--ease-out)}
.confirm-head{padding:20px 22px 4px;text-align:center}
.confirm-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.confirm-icon.danger{background:var(--danger-bg);color:var(--danger)}
.confirm-icon.warn{background:var(--warn-bg);color:var(--warn)}
.confirm-icon.info{background:var(--info-bg);color:var(--info)}
.confirm-icon.success{background:var(--success-bg);color:var(--success)}
.confirm-icon svg{width:28px;height:28px}
.confirm-head h3{font-size:17px;font-weight:700;margin:0 0 6px;color:var(--text)}
.confirm-head p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.confirm-body{padding:14px 22px 20px}
.confirm-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;background:#FAFBFD}
.confirm-foot .spacer{margin-left:auto}

/* Dropdown menu */
.menu{position:absolute;z-index:70;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:180px;animation:scaleIn .15s var(--ease-out);transform-origin:top right}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:7px;font-size:13px;color:var(--text);text-align:left;font-weight:500}
.menu button:hover{background:#F2F5FA}
.menu button svg{width:16px;height:16px;color:var(--muted)}
.menu button.danger{color:var(--danger)}
.menu button.danger svg{color:var(--danger)}
.menu .sep{height:1px;background:var(--border);margin:5px -6px}
.menu-head{padding:8px 11px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* Misc */
.divider{height:1px;background:var(--border);margin:18px 0}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty svg{width:48px;height:48px;margin:0 auto 14px;opacity:.4}
.empty h4{font-size:15px;font-weight:600;color:var(--text);margin:0 0 4px}
.empty p{font-size:13px;margin:0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13px}
.kv .k{color:var(--muted);font-weight:500}
.kv .v{color:var(--text);font-weight:500;word-break:break-word}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#EEF1F6;color:#5b6b82}
.chip.ig{background:var(--ig-grad);color:#fff}
.link-list{display:flex;flex-direction:column;gap:6px}
.link-list a{font-size:12px;display:inline-flex;align-items:center;gap:5px;word-break:break-all}

/* Case detail */
.cd-header{display:flex;align-items:center;gap:16px;padding:20px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:18px;flex-wrap:wrap}
.cd-header .cdh-meta{flex:1;min-width:0}
.cd-header h2{font-size:20px;font-weight:800;margin:0 0 4px;color:var(--navy);display:flex;align-items:center;gap:10px}
.cd-header .cdh-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cd-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.cd-col .card{margin-bottom:18px}
.success-banner{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--success-bg);border:1px solid #bfe6d4;border-radius:var(--radius-sm);color:#0f7d4f;font-weight:600;margin-bottom:18px}
.success-banner svg{width:24px;height:24px;flex-shrink:0}
.timeline{position:relative;padding-left:8px}
.tl-item{display:flex;gap:14px;padding-bottom:18px;position:relative}
.tl-item::before{content:"";position:absolute;left:13px;top:24px;bottom:0;width:2px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
.tl-dot.done{background:var(--success);border-color:var(--success);color:#fff}
.tl-dot.current{background:#fff;border-color:var(--info);color:var(--info);box-shadow:0 0 0 4px var(--info-bg)}
.tl-dot svg{width:14px;height:14px}
.tl-body{flex:1;min-width:0;padding-top:2px}
.tl-body .ttl{font-size:13px;font-weight:600;color:var(--text)}
.tl-body .ts{font-size:11px;color:var(--muted);margin-top:2px}
.event-bars{display:flex;flex-direction:column;gap:10px}
.event-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:#F8FAFD;border:1px solid var(--border)}
.event-bar .eb-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.event-bar .eb-tx{flex:1;min-width:0}
.event-bar .eb-tx .l{font-size:12px;color:var(--muted);font-weight:600}
.event-bar .eb-tx .v{font-size:13px;color:var(--text);font-weight:600;word-break:break-word}
.meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.meta-cell{background:#fff;padding:14px 16px}
.meta-cell .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.meta-cell .v{font-size:13px;color:var(--text);font-weight:600;word-break:break-word}
.note-item{padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#FAFBFD}
.note-item .nh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.note-item .nh .who{font-size:12px;font-weight:600;color:var(--text)}
.note-item .nh .when{font-size:11px;color:var(--muted);margin-left:auto}
.note-item .nt{font-size:13px;color:var(--text);line-height:1.5}
.log-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12px}
.log-item:last-child{border-bottom:none}
.log-item .lt{color:var(--muted);white-space:nowrap;flex-shrink:0;width:120px}
.log-item .lx{color:var(--text)}
.signal-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.signal-row:last-child{border-bottom:none}
.signal-row .sl{flex:1;font-size:13px}
.signal-row .sw{width:36px;height:20px;background:#D8DEE8;border-radius:999px;position:relative;cursor:pointer;transition:background .15s;flex-shrink:0}
.signal-row .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s var(--ease)}
.signal-row .sw.on{background:var(--success)}
.signal-row .sw.on::after{transform:translateX(16px)}
.cd-actionbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 20px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:18px}

/* Ban reasons */
.ban-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ban-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .18s var(--ease),box-shadow .18s var(--ease);display:flex;flex-direction:column}
.ban-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.ban-card-head{padding:16px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border)}
.ban-card-head .bi{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ban-card-head .bi svg{width:22px;height:22px}
.ban-card-head .bt{flex:1;min-width:0}
.ban-card-head h4{font-size:14px;font-weight:700;margin:0 0 2px;color:var(--text)}
.ban-card-head p{font-size:12px;color:var(--muted);margin:0;line-height:1.4}
.ban-card-body{padding:14px 16px;flex:1}
.ban-card-body .lab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px}
.ban-card-body .lab:first-child{margin-top:0}
.ban-card-body .tx{font-size:12px;color:var(--text);line-height:1.5}
.ban-card-body ul{margin:0;padding-left:16px}
.ban-card-body ul li{font-size:12px;color:var(--text);line-height:1.6}
.ban-card-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;background:#FAFBFD}

/* Services */
.svc-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border-radius:var(--radius);padding:28px;color:#fff;position:relative;overflow:hidden;margin-bottom:22px;box-shadow:var(--shadow-md)}
.svc-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:var(--ig-grad);opacity:.18;border-radius:50%;filter:blur(20px)}
.svc-hero h2{font-size:24px;font-weight:800;margin:0 0 8px;letter-spacing:-.3px;position:relative}
.svc-hero p{font-size:14px;color:rgba(255,255,255,.7);margin:0 0 18px;max-width:560px;position:relative}
.svc-hero .svc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;position:relative}
.svc-hero .svc-stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px}
.svc-hero .svc-stat .n{font-size:22px;font-weight:800}
.svc-hero .svc-stat .l{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px}
.svc-sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
.svc-sec-head .si{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.svc-sec-head h3{font-size:16px;font-weight:700;margin:0;color:var(--navy)}
.svc-sec-head .sub{font-size:12px;color:var(--muted)}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.svc-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.svc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.svc-card .si{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.svc-card .si svg{width:24px;height:24px}
.svc-card h4{font-size:15px;font-weight:700;margin:0 0 4px;color:var(--text)}
.svc-card p{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.svc-card .usage{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border)}
.svc-card .usage .uc{font-size:18px;font-weight:800;color:var(--navy)}
.svc-card .usage .ul{font-size:11px;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.flow-step{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow-sm);position:relative}
.flow-step .num{width:32px;height:32px;border-radius:50%;background:var(--ig-grad);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.flow-step h4{font-size:13px;font-weight:700;margin:0 0 4px;color:var(--text)}
.flow-step p{font-size:11px;color:var(--muted);margin:0;line-height:1.4}

/* Simulated data notice */
.sim-notice{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--warn-bg);border:1px solid #f1d98a;border-radius:10px;font-size:12px;color:#8a6200;margin-bottom:18px}
.sim-notice svg{width:18px;height:18px;flex-shrink:0}

/* Mobile drawer overlay */
.drawer-overlay{position:fixed;inset:0;background:rgba(8,18,38,.45);z-index:35;display:none}
.drawer-overlay.show{display:block;animation:fadeIn .2s}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOutRight{to{opacity:0;transform:translateX(30px)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.fade-in{animation:fadeIn .35s var(--ease-out)}
.slide-up{animation:slideUp .35s var(--ease-out)}

/* Responsive */
@media(max-width:1024px){
  :root{--sidebar-w:240px}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .cd-grid{grid-template-columns:1fr}
  .ban-grid{grid-template-columns:repeat(2,1fr)}
  .svc-grid{grid-template-columns:repeat(2,1fr)}
  .flow{grid-template-columns:repeat(2,1fr)}
  .svc-hero .svc-stats{grid-template-columns:repeat(2,1fr)}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .checkbox-grid{grid-template-columns:repeat(2,1fr)}
  .search-wrap{flex-basis:200px}
}
@media(max-width:640px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .topbar .tb-toggle{display:inline-flex}
  .content{padding:18px 14px 70px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .ban-grid,.svc-grid,.flow,.checkbox-grid{grid-template-columns:1fr}
  .svc-hero .svc-stats{grid-template-columns:repeat(2,1fr)}
  .modal-overlay{padding:0}
  .modal{max-width:100%;border-radius:0;min-height:100vh}
  .modal-body{max-height:none}
  .dyn-row,.dyn-row-3{grid-template-columns:1fr 1fr auto;row-gap:8px}
  .view-head h1{font-size:20px}
  .meta-grid{grid-template-columns:1fr}
  .cd-actionbar{flex-direction:column;align-items:stretch}
  .cd-actionbar .btn,.cd-actionbar .select{width:100%}
  .toolbar .search-mini{flex:1 1 100%}
  .topbar .tb-date{display:none}
  .profile-pill .pp-meta{display:none}
  .dyn-row .dyn-rm{grid-column:2/3;justify-self:end}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* ============================================================
   MODERATION VIEW
   ============================================================ */
.mod-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mod-card-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:border-color .15s var(--ease),box-shadow .15s var(--ease);display:flex;flex-direction:column;gap:10px}
.mod-card-row:hover{border-color:var(--navy-3);box-shadow:var(--shadow-md)}
.mod-card-row .mcr-top{display:flex;align-items:center;gap:12px}
.mod-card-row .mcr-meta{min-width:0;flex:1}
.mod-card-row .mcr-uname{font-weight:700;color:var(--text);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-card-row .mcr-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-card-row .mcr-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.mod-card-row .mcr-prog{flex:1;max-width:120px}
/* Detail card (mobile-style moderation panel) */
.mod-detail{max-width:560px;margin:0 auto}
.mod-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md)}
.mod-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.mod-head .mh-meta{flex:1;min-width:0}
.mod-head .mh-id{font-weight:800;color:var(--text);font-size:16px}
.mod-head .mh-handle{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-head .mh-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mod-head .mh-close:hover{background:#F2F5FA;color:var(--text)}
.mod-head .mh-close svg{width:18px;height:18px}
.mod-sec{padding:16px 18px;border-bottom:1px solid var(--border)}
.mod-sec:last-child{border-bottom:none}
.mod-sec h4{font-size:13px;font-weight:800;color:var(--text);margin:0 0 12px;letter-spacing:.1px}
.mod-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mod-info-cell{background:#F4F6FA;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.mod-info-cell .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:capitalize;margin-bottom:4px}
.mod-info-cell .val{font-size:15px;font-weight:800;color:var(--text)}
.mod-info-cell .val.editable{cursor:text;border-radius:6px;padding:1px 3px;margin:-1px -3px;outline:none}
.mod-info-cell .val.editable:hover{background:#fff;box-shadow:0 0 0 2px var(--info-bg)}
.mod-info-cell .val.editable:focus{background:#fff;box-shadow:0 0 0 2px var(--navy-3);color:var(--navy)}
.mod-pills{display:flex;flex-wrap:wrap;gap:8px}
.mod-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}
.mod-pill .pill-dot{width:7px;height:7px;border-radius:50%}
.mod-pill.risk-red{background:var(--danger-bg);color:var(--danger)}
.mod-pill.risk-red .pill-dot{background:var(--danger)}
.mod-pill.risk-amber{background:var(--warn-bg);color:#b27d00}
.mod-pill.risk-amber .pill-dot{background:var(--warn)}
.mod-pill.risk-navy{background:#E7ECF6;color:var(--navy)}
.mod-pill.risk-navy .pill-dot{background:var(--navy)}
.mod-pill.muted{background:#F4F6FA;color:var(--muted)}
.mod-login-row{display:flex;align-items:center;gap:12px;background:#F4F6FA;border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.mod-login-row:last-child{margin-bottom:0}
.mod-login-row .lr-ic{width:32px;height:32px;border-radius:8px;background:#E7ECF6;color:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mod-login-row .lr-meta{flex:1;min-width:0}
.mod-login-row .lr-country{font-weight:700;color:var(--text);font-size:13px}
.mod-login-row .lr-device{font-size:12px;color:var(--muted)}
.mod-login-row .lr-risk{font-size:12px;font-weight:800;text-transform:capitalize}
.mod-login-row .lr-risk.low{color:var(--success)}
.mod-login-row .lr-risk.medium{color:#b27d00}
.mod-login-row .lr-risk.high{color:var(--danger)}
.mod-login-row .lr-rm{width:26px;height:26px;border-radius:6px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.mod-login-row .lr-rm:hover{background:#FDECEE;color:var(--danger)}
.mod-login-row .lr-rm svg{width:15px;height:15px}
.mod-login-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mod-login-add .input,.mod-login-add select{flex:1;min-width:0}
.mod-fix-banner{background:var(--info-bg);border:1px solid #cfe0f7;border-radius:10px;padding:12px 14px;color:#1d4ed8;font-size:13px;line-height:1.55;font-weight:600}
.mod-fix-banner.editable{cursor:text;outline:none}
.mod-fix-banner.editable:focus{box-shadow:0 0 0 2px var(--navy-3);border-color:var(--navy-3)}
.mod-actions{display:flex;flex-direction:column;gap:8px}
.mod-actions .ma-row{display:flex;gap:8px}
.mod-actions .btn{width:100%;justify-content:center;padding:11px 14px;font-weight:700}
.mod-actions .ma-row .btn{flex:1}
.mod-progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mod-progress-top .lbl{font-size:13px;color:var(--muted);font-weight:600}
.mod-progress-top .val{font-size:15px;font-weight:800;color:var(--text)}
.mod-progress-track{height:10px;border-radius:999px;background:#EEF1F6;overflow:hidden;margin-bottom:12px}
.mod-progress-track>span{display:block;height:100%;background:var(--ig-grad);border-radius:999px;transition:width .3s var(--ease)}
.mod-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;background:#E5EAF1;outline:none;margin-bottom:12px}
.mod-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--navy);border:3px solid #fff;box-shadow:0 1px 4px rgba(10,31,68,.4);cursor:pointer}
.mod-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--navy);border:3px solid #fff;box-shadow:0 1px 4px rgba(10,31,68,.4);cursor:pointer}
.mod-mini-input{font:inherit;color:var(--text);background:#F4F6FA;border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%}
.mod-mini-input:focus{outline:none;border-color:var(--navy-3);background:#fff}
@media(max-width:640px){
  .mod-info-grid{grid-template-columns:repeat(3,1fr)}
  .mod-info-cell{padding:8px 6px}
  .mod-info-cell .val{font-size:13px}
  .mod-detail{max-width:100%}
}
</style>
</head>
<body>

<div id="loginScreen" style="display:none"></div>

<!-- ====================== APP ====================== -->
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="modalMount"></div>

function fmtDate(d){
  if(!d) return '—';
  const dt = (d instanceof Date)? d : new Date(d);
  if(isNaN(dt)) return String(d);
  return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
}
function fmtDateTime(d){
  if(!d) return '—';
  const dt=(d instanceof Date)?d:new Date(d);
  if(isNaN(dt)) return String(d);
  return dt.toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function relTime(d){
  if(!d) return '';
  const dt=(d instanceof Date)?d:new Date(d); if(isNaN(dt)) return '';
  const diff=Date.now()-dt.getTime(); const day=86400000;
  if(diff<0) return 'in the future';
  if(diff<3600000) return Math.max(1,Math.floor(diff/60000))+'m ago';
  if(diff<day) return Math.floor(diff/3600000)+'h ago';
  if(diff<30*day) return Math.floor(diff/day)+'d ago';
  return fmtDate(dt);
}

function authenticate(email, password){
  email=String(email||'').trim().toLowerCase();
  const u = db.users.find(x=>String(x.email).toLowerCase()===email);
  if(!u) return {ok:false, error:'No account found with that email.'};

/* ---------- Confirm dialog ---------- */
let confirmCtx=null;
function confirmAction(opts){
  opts=opts||{};
  const title=opts.title||'Are you sure?';
  const message=opts.message||'This action cannot be undone.';
  const confirmText=opts.confirmText||'Confirm';
  const cancelText=opts.cancelText||'Cancel';
  const variant=opts.variant||'danger';
  const onConfirm=opts.onConfirm||function(){};
  const onCancel=opts.onCancel||function(){};
  const mount=el('confirmMount');
  const ov=document.createElement('div');
  ov.className='confirm-overlay';
  ov.innerHTML =
    '<div class="confirm-box" role="dialog" aria-modal="true">'+
      '<div class="confirm-head">'+
        '<div class="confirm-icon '+variant+'">'+(variant==='danger'?ICONS.trash: variant==='warn'?ICONS.alert: variant==='success'?ICONS.checkCircle:ICONS.info)+'</div>'+
        '<h3>'+esc(title)+'</h3><p>'+esc(message)+'</p>'+
      '</div>'+
      (opts.extra?'<div class="confirm-body">'+opts.extra+'</div>':'<div class="confirm-body"></div>')+
      '<div class="confirm-foot"><button class="btn btn-secondary btn-sm" data-c="cancel">'+esc(cancelText)+'</button><div class="spacer"></div><button class="btn '+(variant==='danger'?'btn-danger-solid':'btn-primary')+' btn-sm" data-c="ok">'+esc(confirmText)+'</button></div>'+
    '</div>';
  mount.innerHTML='';
  mount.appendChild(ov);
  confirmCtx={ov,onConfirm,onCancel};
  const close=(result)=>{ if(!confirmCtx) return; const ctx=confirmCtx; confirmCtx=null; ctx.ov.remove(); document.removeEventListener('keydown',confirmEsc); if(result) ctx.onConfirm(); else ctx.onCancel(); };
  ov.addEventListener('click',(e)=>{ if(e.target===ov) close(false); });
  ov.querySelector('[data-c="cancel"]').addEventListener('click',()=>close(false));
  ov.querySelector('[data-c="ok"]').addEventListener('click',()=>close(true));
  document.addEventListener('keydown',confirmEsc);
  setTimeout(()=>{ try{ ov.querySelector('[data-c="'+(variant==='danger'?'cancel':'ok')+'"]').focus(); }catch(e){} },10);
}
function confirmEsc(e){ if(e.key==='Escape' && confirmCtx){ const c=confirmCtx; confirmCtx=null; c.ov.remove(); document.removeEventListener('keydown',confirmEsc); c.onCancel(); } }

/* ---------- Dropdown menu ---------- */
let openMenu=null;
function openMenuAt(anchor, items, opts){
  opts=opts||{};
  closeMenu();
  const mount=el('menuMount');
  const rect=anchor.getBoundingClientRect();
  const menu=document.createElement('div');
  menu.className='menu';
  let html='';
  items.forEach(it=>{
    if(!it) return;
    if(it.sep){ html+='<div class="sep"></div>'; return; }
    if(it.head){ html+='<div class="menu-head">'+esc(it.head)+'</div>'; return; }
    html+='<button data-action="'+esc(it.id||'')+'" '+(it.disabled?'disabled':'')+' class="'+(it.danger?'danger':'')+'">'+(it.icon?ICONS[it.icon]||'':'')+'<span>'+esc(it.label)+'</span></button>';
  });
  menu.innerHTML=html;
  mount.innerHTML=''; mount.appendChild(menu);
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  let left=rect.right-mw; let top=rect.bottom+6;
  if(opts.align==='left') left=rect.left;
  if(left<8) left=8; if(left+mw>window.innerWidth-8) left=window.innerWidth-mw-8;
  if(top+mh>window.innerHeight-8) top=rect.top-mh-6;
  if(top<8) top=8;
  menu.style.left=left+'px'; menu.style.top=top+'px';
  openMenu={menu,anchor};
  menu.querySelectorAll('button[data-action]').forEach(b=>{
    b.addEventListener('click',()=>{ const act=b.getAttribute('data-action'); closeMenu(); const it=items.find(i=>i.id===act); if(it&&it.onClick) it.onClick(); });
  });
  setTimeout(()=>document.addEventListener('mousedown',menuOutside),0);
}
function menuOutside(e){ if(openMenu && !openMenu.menu.contains(e.target) && !openMenu.anchor.contains(e.target)) closeMenu(); }
function closeMenu(){ if(openMenu){ openMenu.menu.remove(); openMenu=null; document.removeEventListener('mousedown',menuOutside); } }

/* ---------- Modal ---------- */
let modalCtx=null;
function openModal(opts){
  opts=opts||{};
  closeMenu();
  closeModal();
  const mount=el('modalMount');
  const size=opts.size||'';
  const ov=document.createElement('div');
  ov.className='modal-overlay';
  const modal=document.createElement('div');
  modal.className='modal '+size;
  const head='<div class="modal-head">'+
      (opts.icon?icon(opts.icon)+'':'')+
      '<div style="flex:1"><h3>'+esc(opts.title||'')+'</h3>'+(opts.subtitle?'<div class="mh-sub">'+esc(opts.subtitle)+'</div>':'')+'</div>'+
      '<button class="close" data-c="close" aria-label="Close">'+ICONS.x+'</button></div>';
  modal.innerHTML = head + '<div class="modal-body" id="modalBody"></div>' + (opts.footer!==false?'<div class="modal-foot" id="modalFoot"></div>':'');
  ov.appendChild(modal);
  mount.innerHTML=''; mount.appendChild(ov);
  const body=modal.querySelector('#modalBody');
  const foot=modal.querySelector('#modalFoot');
  if(typeof opts.body==='string') body.innerHTML=opts.body; else if(opts.body instanceof Node) body.appendChild(opts.body);
  if(opts.footer!==false){
    if(typeof opts.footer==='string') foot.innerHTML=opts.footer;
    else if(opts.footer instanceof Node) foot.appendChild(opts.footer);
    else foot.innerHTML='<button class="btn btn-secondary btn-sm" data-c="close">Close</button>';
  }
  modalCtx={ov,modal,body,foot,onClose:opts.onClose||null, dirty:false};
  ov.addEventListener('click',(e)=>{ if(e.target===ov){ if(modalCtx&&modalCtx.dirty) confirmDiscard(); else closeModal(); } });
  modal.querySelector('[data-c="close"]').addEventListener('click',()=>{ if(modalCtx&&modalCtx.dirty) confirmDiscard(); else closeModal(); });
  document.addEventListener('keydown',modalEsc);
  if(opts.onReady) opts.onReady(modalCtx);
  return modalCtx;
}
function confirmDiscard(){ confirmAction({title:'Discard changes?',message:'You have unsaved changes. Closing will lose them.',confirmText:'Discard',onConfirm:closeModal}); }
function modalEsc(e){ if(e.key==='Escape' && modalCtx){ if(modalCtx.dirty) confirmDiscard(); else closeModal(); } }
function closeModal(){ if(!modalCtx) return; const c=modalCtx; modalCtx=null; document.removeEventListener('keydown',modalEsc); c.ov.remove(); if(c.onClose) c.onClose(); }
function setModalDirty(v){ if(modalCtx) modalCtx.dirty=!!v; }

function seedAll(){
  if(Store.get(KEYS.users,null)===null) db.users=seedUsers(); else db.users=Store.get(KEYS.users,[]);
  if(Store.get(KEYS.cases,null)===null) db.cases=seedCases(); else db.cases=Store.get(KEYS.cases,[]);
  // Migrate older saved cases so the Moderation view has every field it needs.
  // Only fills in missing fields; never overwrites or removes existing data.
  db.cases.forEach(c=>{
    if(typeof c.followers!=='number') c.followers=0;
    if(!Array.isArray(c.loginActivity)) c.loginActivity=[];
    if(!Array.isArray(c.idProofs)) c.idProofs=[];
    if(!Array.isArray(c.appeals)) c.appeals=[];
    if(!c.approvedAt) c.approvedAt=null;
    if(typeof c.modProgress!=='number') c.modProgress=null;
  });
  if(Store.get(KEYS.takedowns,null)===null) db.takedowns=seedTakedowns(); else db.takedowns=Store.get(KEYS.takedowns,[]);
  if(Store.get(KEYS.settings,null)===null) db.settings={sidebarCollapsed:false}; else db.settings=Store.get(KEYS.settings,{sidebarCollapsed:false});
  persist();
}
/* Ensure the two demo accounts exist with the documented credentials.
   Used by the login screen "Restore demo data" action and as a safety net
   when stored users are missing or passwords were changed. Keeps existing
   cases/takedowns intact; only (re)creates the demo admin + agent. */
function ensureDemoUsers(){
  const seeds=seedUsers();
  seeds.forEach(s=>{
    const idx=db.users.findIndex(u=>u.id===s.id || String(u.email).toLowerCase()===s.email);
    if(idx===-1) db.users.push(s);
    else db.users[idx]=Object.assign({},db.users[idx],{name:s.name,email:s.email,password:s.password,role:s.role,agentCode:s.agentCode,status:'active',id:s.id});
  });
  persist();
  loadDB();
}
/* Full reset: wipe all nikhil_* keys (keeping a backup) and re-seed sample data. */
function restoreDemoData(){
  Store.set(KEYS.backup,{at:Date.now(),users:db.users,cases:db.cases,takedowns:db.takedowns,settings:db.settings});
  Store.remove(KEYS.users); Store.remove(KEYS.cases); Store.remove(KEYS.takedowns); Store.remove(KEYS.settings); Store.remove(KEYS.session);
  db.users=[]; db.cases=[]; db.takedowns=[]; db.settings={sidebarCollapsed:false}; session=null;
  seedAll(); loadDB();
}
/* Diagnostic shown on the login screen so a locked-out user understands why. */
function loginDiagnostic(){
  const n=db.users.length;
  if(n===0) return 'No user accounts found in local storage. Use "Restore demo data" below.';
  const hasAdmin=db.users.some(u=>String(u.email).toLowerCase()==='admin@nikhilportal.io');
  if(!hasAdmin) return 'The demo admin account is missing. Use "Restore demo data" below.';
  return '';
}

/* ---------- Routing ---------- */
function navigate(view, opts){
  opts=opts||{};
  closeMenu();
  if(window.innerWidth<=640){ el('sidebar').classList.remove('open'); el('drawerOverlay').classList.remove('show'); }
  // permission gate
  const navItem=NAV.find(n=>n.id===view);
  const u=currentUser();
  if(navItem && navItem.adminOnly && (!u||u.role!=='admin')){
    showToast('Access restricted','User management is admin-only.','error');
    view='dashboard';
  }
  if(view==='case'){ App.currentCaseId=opts.caseId; renderCaseView(); App.currentView='case'; syncNav(); return; }
  if(view==='moddetail'){ App.currentCaseId=opts.caseId; renderModerationDetail(); App.currentView='moddetail'; syncNav(); return; }
  App.currentView=view;
  App.currentCaseId=null;
  syncNav();
  const content=el('content');
  content.scrollTop=0;
  switch(view){
    case 'dashboard': renderDashboard(); break;
    case 'cases': renderCases(); break;
    case 'moderation': renderModeration(); break;
    case 'takedowns': renderTakedowns(); break;
    case 'banreasons': renderBanReasons(); break;
    case 'services': renderServices(); break;
    case 'accounts': renderAccounts(); break;
    case 'settings': renderSettings(); break;
    default: renderDashboard();
  }
}
function syncNav(){
  qsa('.nav-item').forEach(b=> b.classList.toggle('active', b.getAttribute('data-nav')===App.currentView));
}

function computeStats(){
  const cases=db.cases;
  const total=cases.length;
  const inProgress=cases.filter(c=>c.status!=='Closed' && c.status!=='Resolution').length;
  const completed=cases.filter(c=>c.status==='Closed').length;
  const restored=cases.filter(c=>isRestored(c)).length;
  const successRate=completed?Math.round((restored/completed)*100):0;
  const pending=cases.filter(c=>c.status==='Decision'||c.status==='Manual Review').length;
  return {total,inProgress,completed,successRate,restored,pending};
}

function filterCases(){
  const f=App.filters;
  let list=db.cases.slice();
  if(f.search){ const q=f.search.toLowerCase(); list=list.filter(c=> c.username.toLowerCase().includes(q) || c.id.toLowerCase().includes(q) || (c.clientName||'').toLowerCase().includes(q)); }
  if(f.status!=='all') list=list.filter(c=>c.status===f.status);
  if(f.service!=='all') list=list.filter(c=>c.services.includes(f.service));
  switch(f.sort){
    case 'oldest': list.sort((a,b)=>a.created-b.created); break;
    case 'username': list.sort((a,b)=>a.username.localeCompare(b.username)); break;
    case 'status': list.sort((a,b)=>(STAGE_INDEX[a.status]||1)-(STAGE_INDEX[b.status]||1)); break;
    default: list.sort((a,b)=>b.created-a.created);
  }
  return list;
}

function renderPagination(total,page,pages,onPage){
  if(pages<=1) return '<div class="pagination"><div class="info">'+total+' case'+(total!==1?'s':'')+'</div><div class="pages"><button class="active">1</button></div></div>';
  let html='<div class="pagination"><div class="info">Showing '+((page-1)*App.filters.perPage+1)+'–'+Math.min(total,page*App.filters.perPage)+' of '+total+'</div><div class="pages">';
  html+='<button data-p="'+(page-1)+'" '+(page<=1?'disabled':'')+'>'+ICONS.chevronLeft+'</button>';
  const range=[]; for(let i=1;i<=pages;i++){ if(i===1||i===pages||(i>=page-1&&i<=page+1)) range.push(i); else if(range[range.length-1]!=='…') range.push('…'); }
  range.forEach(p=>{ if(p==='…') html+='<button disabled>…</button>'; else html+='<button data-p="'+p+'" class="'+(p===page?'active':'')+'">'+p+'</button>'; });
  html+='<button data-p="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>'+ICONS.chevronRight+'</button>';
  html+='</div></div>';
  setTimeout(()=>{ qsa('#casesTableWrap [data-p], #tdTableWrap [data-p]').forEach(b=> b.addEventListener('click',()=>{ const p=parseInt(b.getAttribute('data-p'),10); if(!isNaN(p)) onPage(p); })); },0);
  return html;
}

function signalRow(key,label,on){ return '<div class="signal-row"><div class="sl">'+esc(label)+'</div><div class="sw'+(on?' on':'')+'" data-key="'+key+'" role="switch" aria-checked="'+(on?'true':'false')+'" tabindex="0"></div></div>'; }

/* ---------- Case actions ---------- */
function changeCaseStatus(id,newStatus){
  const c=caseById(id); if(!c) return;
  const old=c.status;
  if(old===newStatus) return;
  c.status=newStatus; c.progress=STAGE_INDEX[newStatus]||1;
  if(newStatus==='Resolution' && !c.restoredAt) c.restoredAt=Date.now();
  if(newStatus==='Closed' && !c.restoredAt && old==='Resolution') c.restoredAt=c.restoredAt||Date.now();
  addLog(c,'Status changed from "'+old+'" to "'+newStatus+'".');
  persist();
  showToast('Status updated', c.username+' is now '+newStatus,'success');
  renderCaseView();
}
function closeCase(id){
  const c=caseById(id); if(!c) return;
  if(c.status==='Closed'){ showToast('Already closed','This case is already closed.','info'); return; }
  confirmAction({title:'Close this case?',message:c.username+' will be marked Closed. You can reopen it by changing the status later.',confirmText:'Close Case',variant:'warn',onConfirm:()=>{
    c.status='Closed'; c.progress=7; if(!c.restoredAt) c.restoredAt=Date.now();
    addLog(c,'Case closed.');
    persist(); showToast('Case closed',c.id+' marked as closed.','success'); renderCaseView();
  }});
}
/* Reactivate a banned/disabled account: marks it restored (Resolution) with a
   restored-at timestamp and a log entry. Simulated only. */
function reactivateCase(id){
  const c=caseById(id); if(!c) return;
  if(c.status==='Resolution' && c.restoredAt){ showToast('Already reactivated',c.username+' is already marked as reactivated.','info'); return; }
  confirmAction({
    title:'Reactivate this account?',
    message:c.username+' will be marked as Reactivated (status → Resolution) with a restored-at timestamp. This is a simulated record — Nikhil Portal is not connected to Meta\u2019s internal systems.',
    confirmText:'Reactivate Account',variant:'success',
    onConfirm:()=>{
      const old=c.status;
      c.status='Resolution'; c.progress=STAGE_INDEX['Resolution']; c.restoredAt=Date.now();
      addLog(c,'Account reactivated. Status changed from "'+old+'" to "Resolution".');
      persist();
      showToast('Account reactivated',c.username+' is now marked as reactivated.','success');
      if(App.currentView==='moddetail') renderModerationDetail(); else renderCaseView();
    }
  });
}
function deleteCase(id){
  const c=caseById(id); if(!c) return;
  confirmAction({title:'Delete this case?',message:'Case '+c.id+' ('+c.username+') will be permanently removed. This cannot be undone.',confirmText:'Delete',variant:'danger',onConfirm:()=>{
    db.cases=db.cases.filter(x=>x.id!==id); persist();
    showToast('Case deleted',c.id+' was removed.','success');
    if(App.currentView==='case') navigate('cases'); else renderCasesList();
  }});
}
function addLog(c,text){ c.logs.push({when:Date.now(),text}); }
function openStatusDialog(id){
  const c=caseById(id); if(!c) return;
  openModal({title:'Change Status',subtitle:esc(c.id)+' · '+esc(c.username),size:'modal-sm',icon:'chevronDown',body:
    '<div class="field"><label>New status</label><select class="select" id="dlgStatus">'+STATUS_LIST.map(st=>'<option value="'+st+'"'+(c.status===st?' selected':'')+'>'+st+'</option>').join('')+'</select></div>',
    footer:'<button class="btn btn-secondary btn-sm" data-c="close">Cancel</button><div class="spacer"></div><button class="btn btn-primary btn-sm" id="dlgStatusOk">Apply</button>',
    onReady:(ctx)=>{ ctx.modal.querySelector('#dlgStatusOk').addEventListener('click',()=>{ const v=ctx.modal.querySelector('#dlgStatus').value; closeModal(); changeCaseStatus(c.id,v); }); }

function openNoteDialog(id){
  const c=caseById(id); if(!c) return;
  const u=currentUser();

    onReady:(ctx)=>{ const ta=ctx.modal.querySelector('#dlgNote'); ta.addEventListener('input',()=>setModalDirty(ta.value.trim().length>0)); ctx.modal.querySelector('#dlgNoteOk').addEventListener('click',()=>{ const v=ta.value.trim(); if(!v){ showToast('Note empty','Please enter note text.','error'); return; } c.notes.push({who:u?u.name:'Agent',when:Date.now(),text:v}); addLog(c,'Internal note added.'); persist(); setModalDirty(false); closeModal(); showToast('Note added','Internal note saved.','success'); renderCaseView(); }); }
  });
}

function pfpPreviewHtml(value){
  if(value) return '<img src="'+esc(value)+'" alt="" style="width:100%;height:100%;object-fit:cover">';
  return '<span class="pfp-ph">'+ICONS.instagram+'</span>';
}
function bindCaseModal(ctx,data,isEdit){
  const m=ctx.modal;
  // ---- pfp picker state ----
  let currentPfp=data.pfp||'';
  const pfpPreview=m.querySelector('#cmPfpPreview');
  const pfpUrlInp=m.querySelector('#cmPfpUrl');
  const pfpFileInp=m.querySelector('#cmPfpFile');
  const setPfp=(v)=>{ currentPfp=v||''; if(pfpPreview) pfpPreview.innerHTML=pfpPreviewHtml(currentPfp); setModalDirty(true); };
  if(pfpUrlInp) pfpUrlInp.addEventListener('input',()=>setPfp(pfpUrlInp.value.trim()));
  if(pfpFileInp) pfpFileInp.addEventListener('change',()=>{
    const f=pfpFileInp.files&&pfpFileInp.files[0]; if(!f) return;
    if(f.size>2*1024*1024){ showToast('Image too large','Please use an image under 2 MB.','error'); pfpFileInp.value=''; return; }
    const reader=new FileReader();
    reader.onload=()=>{ const url=String(reader.result||''); if(pfpUrlInp) pfpUrlInp.value=url; setPfp(url); };
    reader.onerror=()=>{ showToast('Upload failed','Could not read that image file.','error'); };
    reader.readAsDataURL(f);
  });
  // ---- dynamic proofs / vouches (edit mode only) ----
  const proofs=data.proofs.slice(); const vouches=data.vouches.slice();
  const renderProofs=()=>{
    const box=m.querySelector('#cmProofs'); if(!box) return;
    box.innerHTML=proofs.map((p,i)=>'<div class="dyn-row"><input class="input" data-p="type" data-i="'+i+'" value="'+esc(p.type)+'" placeholder="Type"><input class="input" data-p="title" data-i="'+i+'" value="'+esc(p.title)+'" placeholder="Title"><input class="input" data-p="url" data-i="'+i+'" value="'+esc(p.url)+'" placeholder="URL"><button class="dyn-rm" data-rm="'+i+'" '+(proofs.length<=1?'disabled':'')+'>'+ICONS.trash+'</button></div>').join('') || '';
    if(proofs.length===0) box.innerHTML='<div class="cell-muted" style="margin-bottom:8px">No proofs added yet.</div>';
    box.querySelectorAll('[data-p]').forEach(inp=> inp.addEventListener('input',()=>{ const idx=+inp.getAttribute('data-i'); proofs[idx][inp.getAttribute('data-p')]=inp.value; setModalDirty(true); }));
    box.querySelectorAll('[data-rm]').forEach(b=> b.addEventListener('click',()=>{ proofs.splice(+b.getAttribute('data-rm'),1); setModalDirty(true); renderProofs(); }));
  };
  const renderVouches=()=>{
    const box=m.querySelector('#cmVouches'); if(!box) return;
    box.innerHTML=vouches.map((v,i)=>'<div class="dyn-row-3"><input class="input" data-v="source" data-i="'+i+'" value="'+esc(v.source)+'" placeholder="Source"><input class="input" data-v="count" data-i="'+i+'" type="number" min="0" value="'+esc(v.count)+'" placeholder="Count"><input class="input" data-v="url" data-i="'+i+'" value="'+esc(v.url)+'" placeholder="URL"><button class="dyn-rm" data-rm="'+i+'" '+(vouches.length<=1?'disabled':'')+'>'+ICONS.trash+'</button></div>').join('')||'';
    if(vouches.length===0) box.innerHTML='<div class="cell-muted" style="margin-bottom:8px">No vouches added yet.</div>';
    box.querySelectorAll('[data-v]').forEach(inp=> inp.addEventListener('input',()=>{ const idx=+inp.getAttribute('data-i'); const k=inp.getAttribute('data-v'); vouches[idx][k]= k==='count'? (parseInt(inp.value,10)||0): inp.value; setModalDirty(true); }));
    box.querySelectorAll('[data-rm]').forEach(b=> b.addEventListener('click',()=>{ vouches.splice(+b.getAttribute('data-rm'),1); setModalDirty(true); renderVouches(); }));
  };
  renderProofs(); renderVouches();
  const proofAdd=m.querySelector('#cmProofAdd'); if(proofAdd) proofAdd.addEventListener('click',()=>{ proofs.push({type:'',title:'',url:''}); setModalDirty(true); renderProofs(); });
  const vouchAdd=m.querySelector('#cmVouchAdd'); if(vouchAdd) vouchAdd.addEventListener('click',()=>{ vouches.push({source:'',count:1,url:''}); setModalDirty(true); renderVouches(); });
  // reason auto-fill (edit mode only)
  const reasonSel=m.querySelector('#cmReasonType'); const reasonTa=m.querySelector('#cmReason');
  if(reasonSel && reasonTa){
    let reasonEdited=!!(data.reason && data.reason!==suggestedReason(data.reasonType));
    reasonTa.addEventListener('input',()=>{ reasonEdited=true; setModalDirty(true); });
    reasonSel.addEventListener('change',()=>{ if(!reasonEdited){ reasonTa.value=suggestedReason(reasonSel.value); } setModalDirty(true); });
  }
  // status -> progress sync (edit mode only)
  const statusSel=m.querySelector('#cmStatus'); const progressInp=m.querySelector('#cmProgress');
  if(statusSel && progressInp){ statusSel.addEventListener('change',()=>{ progressInp.value=STAGE_INDEX[statusSel.value]||1; setModalDirty(true); }); }
  // mark dirty on any input
  m.querySelectorAll('input,select,textarea').forEach(inp=>{ if(inp.id!=='cmReasonType'&&inp.id!=='cmStatus') inp.addEventListener('input',()=>setModalDirty(true)); inp.addEventListener('change',()=>setModalDirty(true)); });
  // value helper (tolerant of fields absent in create mode)
  const V=(sel)=>{ const e=m.querySelector(sel); return e?e.value:''; };
  // save
  m.querySelector('#cmSave').addEventListener('click',()=>{
    const username=V('#cmUsername').trim();
    const name=V('#cmName').trim();
    if(!username){ showToast('Validation error','Username is required.','error'); const ue=m.querySelector('#cmUsername'); if(ue) ue.focus(); return; }
    const reasonType=V('#cmReasonType')||data.reasonType||'Community Standards';
    const status=V('#cmStatus')||data.status||'Submitted';
    const services=qsa('.cmSvc',m).filter(c=>c.checked).map(c=>c.value);
    const base=JSON.parse(JSON.stringify(data));
    const obj=Object.assign(base,{
      username:username.startsWith('@')?username:'@'+username.replace(/^@/,''),
      name:name,
      pfp:currentPfp,
      accountUrl:V('#cmAccountUrl').trim()||('https://instagram.com/'+username.replace('@','')),
      accountType:V('#cmAccountType')||base.accountType,
      accountAge:V('#cmAccountAge').trim()||base.accountAge,
      reasonType:reasonType, reason:V('#cmReason').trim()||suggestedReason(reasonType),
      bannedAt:parseDateInput(V('#cmBannedAt')), disabledAt:parseDateInput(V('#cmDisabledAt')), restoredAt:parseDateInput(V('#cmRestoredAt')),
      status:status, progress:(progressInp?parseInt(progressInp.value,10):0)||STAGE_INDEX[status]||1,
      recoveryUrl:V('#cmRecoveryUrl').trim(), referenceUrl:V('#cmReferenceUrl').trim(),
      clientName:V('#cmClientName').trim()||base.clientName, clientEmail:V('#cmClientEmail').trim(), clientContact:V('#cmClientContact').trim(),
      services:services, proofs:proofs.filter(p=>p.type||p.title||p.url), vouches:vouches.filter(v=>v.source||v.url),
      suggestedFix:base.suggestedFix||suggestedReason(reasonType), created:data.created||Date.now(), metaEmployee:false, sample:!!data.sample
    });
    if(obj.status==='Resolution' && !obj.restoredAt) obj.restoredAt=Date.now();
    if(isEdit){
      const idx=db.cases.findIndex(x=>x.id===obj.id);
      addLog(obj,'Case edited.');
      db.cases[idx]=obj; persist(); setModalDirty(false); closeModal();
      showToast('Case saved','Changes applied to '+obj.id,'success');
      if(App.currentView==='case'){ App.currentCaseId=obj.id; renderCaseView(); } else renderCasesList();
    } else {
      addLog(obj,'Case created and submitted.');
      db.cases.unshift(obj); persist(); setModalDirty(false); closeModal();
      showToast('Account added',obj.username+' added as '+obj.id+'.','success');
      navigate('cases');
    }
  });
  if(isEdit){
    const del=m.querySelector('#cmDelete'); if(del) del.addEventListener('click',()=>{ confirmAction({title:'Delete this case?',message:'Case '+data.id+' will be permanently removed.',confirmText:'Delete',variant:'danger',onConfirm:()=>{ const id=data.id; db.cases=db.cases.filter(x=>x.id!==id); persist(); setModalDirty(false); closeModal(); showToast('Case deleted',id+' removed.','success'); navigate('cases'); }}); });
  }
}

   MODERATION VIEW
   Mobile-style account moderation card. Every field/action below
   persists to localStorage immediately (auto-save) and re-renders.

const SIGNAL_LABELS={
  inauthentic:{label:'fake engagement',cls:'risk-amber'},
  botlike:{label:'spam detected',cls:'risk-red'},
  compromised:{label:'account compromise',cls:'risk-red'},
  repeatViolator:{label:'repeat violator',cls:'risk-amber'},
  suspiciousLogin:{label:'suspicious login',cls:'risk-red'}
};
function modStatusBadge(c){
  let label, cls;
  if((c.approvedAt || (c.restoredAt && (c.status==='Resolution'||c.status==='Closed')))){ label='restored'; cls='risk-navy'; }
  else if(c.disabledAt){ label='banned'; cls='risk-red'; }
  else if(c.status==='Submitted'){ label='flagged'; cls='risk-amber'; }
  else { label=c.status.toLowerCase(); cls='risk-navy'; }
  return '<span class="mod-pill '+cls+'"><span class="pill-dot"></span>'+esc(label)+'</span>';
}
function modProgressPct(c){
  if(typeof c.modProgress==='number' && !isNaN(c.modProgress)) return Math.max(0,Math.min(100,Math.round(c.modProgress)));
  return Math.round(((STAGE_INDEX[c.status]||1)/7)*100);
}
function fmtFollowers(n){
  n=parseInt(n,10)||0;
  if(n>=1000000) return (n/1000000).toFixed(n%1000000===0?0:1)+'M';
  if(n>=1000) return (n/1000).toFixed(n%1000===0?0:1)+'K';
  return String(n);
}
